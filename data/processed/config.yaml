# Walk-forward threshold search methodology
# tennis-research / data/processed
# Generated: 2026-09-29

data_source:
  file: CRITERIA_DATA.xlsx
  excluded_sheets: [US_hard, WE_hard]  # duplicated by *_feb/*_oct/*_summer splits
  note: >
    US_hard is fully covered by US_hard_feb + US_hard_summer (not US_hard_oct,
    which does not exist as a sheet). WE_hard is fully covered by
    WE_hard_feb + WE_hard_oct. Verified by exact match-key set equality
    (Date + PL1 + PL2), zero overlap, zero remainder.

win2_formula:
  description: >
    Flat-stake profit for betting on player 2 (PL2), reconstructed on sheets
    that lack an explicit win2 column, and validated against sheets that do
    (RG, SAm_clay, Eu_Clay, US_hard) with zero discrepancy.
  rule:
    if win == 0:  win2 = 100.0                    # player 2 won -> flat +100
    if win == 1:  win2 = -100.0 / (k2 - 1)         # player 2 lost -> stake sized to risk 100 on player1 win
  win1_formula_symmetric:
    if win == 1:  win1 = 100.0
    if win == 0:  win1 = -100.0 / (k1 - 1)

threshold_search:
  method: >
    Sort matches by ascending k2. Compute cumulative sum of win2 over unique
    k2 values (aggregated by k2 to avoid order-dependence on ties). Select
    the k2 threshold that maximizes cumulative win2, subject to a minimum
    match-count constraint.
  min_matches_under_threshold: 300
  windows:
    - label: "до 2020 вкл"
      end_year: 2020
    - label: "до 2021 вкл"
      end_year: 2021
    - label: "2016-2022 вкл"
      end_year: 2022
    - label: "2017-2023 вкл"
      end_year: 2023
    - label: "2018-2024 вкл"
      end_year: 2024
    - label: "2019-2025 вкл"
      end_year: 2025

no_leak_rule:
  description: >
    To evaluate a given calendar year Y, the k2 threshold MUST be taken from
    the window ending at year Y-1 (never from a window that includes year Y).
    Example: year=2024 uses the threshold computed on window "2017-2023 вкл".
  year_to_window_shift: "+1 year forward from window_end_year to target year"

groups:
  clay:
    - name: SAm_Eu_Clay
      sheets: [SAm_clay, Eu_Clay]
    - name: Masters_RG
      sheets: [Madrid, Monte-Carlo, Rome, RG_Q, RG]
  hard_grass:
    - name: ATP_hard_Masters
      sheets: [WE_hard_feb, WE_hard_oct, US_hard_feb, US_hard_summer, Aus, Chn,
               US1000_march, US1000_aug, Chn_masters, Paris]
    - name: GrandSlam_hard_grass
      sheets: [AO, AO_Q, US_open, US_Q, Wimbledon, Wim_Q]
    - name: ATP_grass
      sheets: [grass]

output_tables:
  clay_thresholds_and_results.xlsx:
    sheet_Thresholds: >
      All 2 groups x 6 windows (including 2019-2025), with Threshold_k2,
      Max_cum_win2, Matches_under_threshold, Total_matches.
    sheet_Results_by_tourn_sheet: >
      35 rows = 7 clay sheets x 5 years (2021-2025). Columns: tourn_sheet,
      group, prev.seasons (sum win2 over 3 years before `year`), curr.season
      (sum win2 in `year`), year, threshold (no-leak, shifted +1y), counts.
  three_groups_hard_grass_thresholds.xlsx:
    sheet_Thresholds: >
      All 3 groups x 6 windows (including 2019-2025).
    sheet_Results_by_tourn_sheet: >
      85 rows = 17 hard/grass sheets x 5 years (2021-2025). Same column
      structure as the clay table.
